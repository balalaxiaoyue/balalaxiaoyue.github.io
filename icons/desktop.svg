<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5fb"/>
      <stop offset="100%" stop-color="#e0f5ee"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)" stroke="#c8e8f0" stroke-width="2"/>
  <!-- Kitty face -->
  <ellipse cx="50" cy="45" rx="26" ry="22" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- ears -->
  <path d="M28 30 L24 14 L40 24 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M72 30 L76 14 L60 24 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <ellipse cx="40" cy="46" rx="3" ry="4" fill="#333"/>
  <ellipse cx="60" cy="46" rx="3" ry="4" fill="#333"/>
  <!-- nose -->
  <ellipse cx="50" cy="52" rx="3" ry="2" fill="#ffce8a"/>
  <!-- whiskers -->
  <line x1="22" y1="44" x2="32" y2="46" stroke="#333" stroke-width="2"/>
  <line x1="22" y1="50" x2="32" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="78" y1="44" x2="68" y2="46" stroke="#333" stroke-width="2"/>
  <line x1="78" y1="50" x2="68" y2="50" stroke="#333" stroke-width="2"/>
  <!-- house -->
  <rect x="42" y="60" width="16" height="12" fill="#b8d8e8" stroke="#5a9eb8" stroke-width="1.5" rx="2"/>
  <path d="M40 60 L50 52 L60 60 Z" fill="#7fc8ff" stroke="#5a9eb8" stroke-width="1.5"/>
  <!-- bow -->
  <ellipse cx="66" cy="26" rx="6" ry="4" fill="#ff8fb1" stroke="#e07098" stroke-width="1"/>
  <circle cx="66" cy="26" r="2.5" fill="#ff8fb1" stroke="#e07098" stroke-width="1"/>
</svg>